# ─────────────────────────────────────────────
# Job Search Agent — Configuration
# Copy this file to config.yaml and fill in your values.
# Sensitive values (passwords, tokens) should be set in .env instead.
# ─────────────────────────────────────────────

# Schedule (used in --daemon mode)
schedule:
  run_time: "07:00"   # 24-hour UTC time

# Email delivery
email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  # Override via .env: EMAIL_SENDER, EMAIL_PASSWORD, EMAIL_RECIPIENT
  sender: "your-email@gmail.com"
  password: ""          # Use App Password — see docs/CONFIGURATION.md
  recipient: "gspr4033@gmail.com"

# Scraper settings
scrapers:
  request_timeout_sec: 15
  retry_attempts: 3
  parallel_workers: 3   # Number of parallel scraper threads

# Filter settings
filters:
  hours_window: 24      # Only include jobs posted within this many hours
  us_only: true         # Strict US-only location filter

# Skills to search across all sources
skills:
  - "AWS Data Engineer"
  - "GCP Data Engineer"
  - "SQL Developer"
  - "PL/SQL Developer"
  - "Hadoop Data Engineer"
  - "Big Data Engineer"
  - "PySpark Developer"
  - "Hive Developer"
  - "Spark Engineer"
  - "ETL Developer Hadoop"

# Sources — set enabled: false to skip a source
sources:
  randstad:
    enabled: true
  manpower:
    enabled: true
  kelly:
    enabled: true
  teamlease:
    enabled: true
    note: "India-based staffing; US coverage limited"
  abc_consultants:
    enabled: true
    note: "India-based staffing; US coverage very limited"
